<!doctype html>
<html lang="en">
  <head>
    <base href="/" id="app-base-href" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>LuckyBox Community Blog & News | Lottery Winner Portal</title>
    <meta name="description" content="Official LuckyBox Community Blog - Lottery tips, winner stories, platform release updates and step-by-step guides." />
    
    <!-- Open Graph / Social Cards -->
    <meta property="og:type" content="article" />
    <meta property="og:title" content="LuckyBox Community Blog & News" />
    <meta property="og:description" content="Read pro winning strategies, verified champion winner interviews, and platform updates." />
    <meta property="og:image" content="logo.jpg" />

    <!-- Google Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Vector Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Master Tailwind CSS v4 Production & Theme Stylesheet -->
    <link rel="stylesheet" href="/src/tailwind-built.css" id="lw-main-css" />

    <style>
      body {
        background-color: #090c14;
        color: #f1f5f9;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .font-heading {
        font-family: 'Outfit', 'Inter', sans-serif;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0b0f19;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
  </head>
  <body class="bg-[#090c14] text-slate-100 min-h-screen flex flex-col selection:bg-amber-500/30 selection:text-amber-200">
    <div id="blog-app-root" class="min-h-screen flex flex-col w-full"></div>

    <!-- Application script for standalone blog portal -->
    <script type="module" src="/src/blog.ts"></script>
  </body>
</html>
