<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Lottery Winner</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var isGitHub = l.hostname.includes('github.io');
      // On custom domains, we are at the root (0 segments). On GitHub subdomain, we are at /project/ (1 segment).
      var pathSegmentsToKeep = (isGitHub && l.pathname.split('/').filter(Boolean).length > 0) ? 1 : 0;

      // Never redirect static assets to avoid invalid MIME types in browsers
      if (!/\.(js|css|png|jpg|jpeg|svg|gif|webp|woff2|woff|ttf|json|ico)$/i.test(l.pathname)) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
