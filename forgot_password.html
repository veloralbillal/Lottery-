<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Passphrase Recovery - Lottery Winner</title>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 20s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-amber-500/30 selection:text-white relative">

  <!-- Decorative Atmosphere Glows -->
  <div class="fixed top-0 right-0 w-96 h-96 bg-amber-500/5 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="fixed bottom-0 left-0 w-96 h-96 bg-emerald-500/5 rounded-full blur-[120px] pointer-events-none"></div>

  <!-- Toast Notification -->
  <div id="toast-notif" class="fixed top-5 right-5 z-50 transform translate-y-[-100px] opacity-0 transition-all duration-300 max-w-sm w-full bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-2xl flex items-start gap-3">
    <div id="toast-icon" class="p-2 bg-amber-500/10 text-amber-500 rounded-xl">
      <i class="fa-solid fa-bell"></i>
    </div>
    <div class="flex-1">
      <span id="toast-text" class="text-xs font-mono font-semibold text-slate-200">Notification message.</span>
    </div>
  </div>

  <!-- Main Card Container -->
  <div class="relative w-full max-w-md bg-gradient-to-b from-slate-900/95 to-slate-950 border border-slate-800/80 p-6 md:p-8 rounded-[32px] shadow-2xl space-y-6 overflow-hidden">
    
    <!-- Header Branding -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 mx-auto bg-gradient-to-tr from-amber-500 to-rose-500 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg shadow-amber-500/10 mb-2">
        <i class="fa-solid fa-key-skeleton"></i>
      </div>
      <h2 class="text-lg font-black font-display tracking-tight text-white uppercase">Access Restoration</h2>
      <p class="text-[9px] text-amber-500 font-mono font-bold tracking-widest uppercase">Enter Master Recovery Key below</p>
    </div>

    <!-- ================= RECOVERY KEY INPUT FORM ================= -->
    <form id="key-recovery-form" class="space-y-4" onsubmit="handleKeyRecovery(event)">
      <div class="space-y-1.5">
        <label class="block text-[8px] uppercase tracking-wider text-slate-500 font-bold font-mono">Username handle</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-600"><i class="fa-solid fa-user text-xs"></i></span>
          <input type="text" id="key-username" required class="w-full bg-slate-950 border border-slate-850 hover:border-slate-800 focus:border-amber-500 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white outline-none font-mono transition" placeholder="lottery_pro" />
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="block text-[8px] uppercase tracking-wider text-slate-500 font-bold font-mono">Master Recovery Key</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-600"><i class="fa-solid fa-shield-halved text-xs"></i></span>
          <input type="text" id="key-token" required class="w-full bg-slate-950 border border-slate-850 hover:border-slate-800 focus:border-amber-500 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white outline-none font-mono transition tracking-widest" placeholder="LWR-XXXX-XXXX-XXXX" />
        </div>
        <p class="text-[9px] text-slate-500 font-sans leading-tight">Key must match the 16-character code generated on your profile.</p>
      </div>

      <div class="border-t border-slate-850/60 my-2 pt-2 space-y-4">
        <div class="space-y-1.5">
          <label class="block text-[8px] uppercase tracking-wider text-slate-500 font-bold font-mono">New Passphrase</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-600"><i class="fa-solid fa-lock text-xs"></i></span>
            <input type="password" id="key-new-pass" required class="w-full bg-slate-950 border border-slate-850 hover:border-slate-800 focus:border-amber-500 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white outline-none font-mono transition" placeholder="••••••••" />
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-[8px] uppercase tracking-wider text-slate-500 font-bold font-mono">Confirm Passphrase</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-600"><i class="fa-solid fa-check text-xs"></i></span>
            <input type="password" id="key-confirm-pass" required class="w-full bg-slate-950 border border-slate-850 hover:border-slate-800 focus:border-amber-500 rounded-xl py-2.5 pl-9 pr-3 text-xs text-white outline-none font-mono transition" placeholder="••••••••" />
          </div>
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 hover:brightness-110 active:scale-[0.99] text-slate-950 font-black text-xs py-3 rounded-xl transition cursor-pointer tracking-wider font-mono flex items-center justify-center gap-1.5 shadow-lg shadow-amber-950/20">
        <i class="fa-solid fa-rotate mr-0.5"></i>RESET PASSPHRASE NOW
      </button>
    </form>

    <!-- Navigation Back Link -->
    <div class="text-center pt-2">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-[10px] font-bold text-slate-400 hover:text-white font-mono tracking-wide transition duration-150">
        <i class="fa-solid fa-arrow-left text-[9px]"></i> Return to Player Sign-In
      </a>
    </div>

  </div>

  <!-- Core Script Logic -->
  <script type="module">
    const dbKey = "lottery_winner_db";
    let firebaseDocRef = null;

    async function initFirebase() {
      try {
        const configRes = await fetch("firebase-applet-config.json");
        if (configRes.ok) {
          const config = await configRes.json();
          const { initializeApp, getApps } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
          const { initializeFirestore, doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
          
          let app;
          const apps = getApps();
          if (apps.length > 0) {
            app = apps[0];
          } else {
            app = initializeApp(config);
          }
          
          const dbId = config.firestoreDatabaseId || "(default)";
          const firestore = initializeFirestore(app, {
            experimentalForceLongPolling: true,
            useFetchStreams: false
          }, dbId);
          
          firebaseDocRef = doc(firestore, "app_data", "lottery_winner_db");
          console.log("Firebase initialized in forgot password page successfully.");
          
          // Pull latest db from firestore on load
          const snapshot = await getDoc(firebaseDocRef);
          if (snapshot.exists()) {
            const cloudData = snapshot.data();
            if (cloudData && cloudData.db) {
              localStorage.setItem(dbKey, cloudData.db);
              console.log("Latest players database loaded from Firebase Cloud on password reset page.");
            }
          }
        }
      } catch (err) {
        console.warn("Could not initialize Firebase in forgot_password page:", err);
      }
    }
    initFirebase();

    async function saveDbToCloud(db) {
      if (firebaseDocRef) {
        try {
          const { setDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
          const dbSerialized = JSON.stringify(db);
          await setDoc(firebaseDocRef, {
            db: dbSerialized,
            updatedAt: new Date().toISOString()
          }, { merge: true });
          console.log("Database successfully synchronized with Firebase cloud from forgot password page.");
        } catch (err) {
          console.error("Failed to sync database to Firebase from forgot password page:", err);
        }
      }
    }

    // Bind handleKeyRecovery globally
    window.handleKeyRecovery = handleKeyRecovery;

    // Toast show helper
    function showToast(text, type = "info") {
      const toast = document.getElementById("toast-notif");
      const icon = document.getElementById("toast-icon");
      const textEl = document.getElementById("toast-text");
      
      if (!toast || !icon || !textEl) return;

      textEl.innerText = text;
      
      if (type === "success") {
        icon.className = "p-2 bg-emerald-500/10 text-emerald-400 rounded-xl";
        icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
      } else if (type === "error") {
        icon.className = "p-2 bg-rose-500/10 text-rose-400 rounded-xl";
        icon.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
      } else {
        icon.className = "p-2 bg-amber-500/10 text-amber-400 rounded-xl";
        icon.innerHTML = '<i class="fa-solid fa-bell"></i>';
      }

      toast.style.transform = "translateY(0)";
      toast.style.opacity = "1";

      setTimeout(() => {
        toast.style.transform = "translateY(-100px)";
        toast.style.opacity = "0";
      }, 4000);
    }

    // Handle Master Key Recovery Submit
    async function handleKeyRecovery(e) {
      e.preventDefault();
      
      const usernameInput = document.getElementById("key-username").value.trim();
      const tokenInput = document.getElementById("key-token").value.trim();
      const newPass = document.getElementById("key-new-pass").value;
      const confirmPass = document.getElementById("key-confirm-pass").value;

      if (!usernameInput || !tokenInput || !newPass || !confirmPass) {
        showToast("Please fill in all inputs.", "error");
        return;
      }

      if (newPass !== confirmPass) {
        showToast("New passphrases do not match.", "error");
        return;
      }

      if (newPass.length < 4) {
        showToast("Passphrase must contain at least 4 characters.", "error");
        return;
      }

      // Load LocalStorage DB
      const rawDB = localStorage.getItem(dbKey);
      if (!rawDB) {
        showToast("No players database registered yet.", "error");
        return;
      }

      try {
        const db = JSON.parse(rawDB);
        const users = db.users || [];
        
        // Find user by username or email
        const user = users.find(u => u.username.toLowerCase() === usernameInput.toLowerCase() || (u.email && u.email.toLowerCase() === usernameInput.toLowerCase()));
        
        if (!user) {
          showToast("No active player matched the username handle.", "error");
          return;
        }

        if (!user.recoveryCode) {
          showToast("This account has not generated a recovery key yet. Please contact support.", "error");
          return;
        }

        if (user.recoveryCode.replace(/\s+/g, '').toUpperCase() !== tokenInput.replace(/\s+/g, '').toUpperCase()) {
          showToast("Master Recovery Key is invalid for this profile.", "error");
          return;
        }

        // Key matched! Update password
        user.password = newPass;
        
        // Also update the messages to notify them
        if (!db.messages) db.messages = [];
        db.messages.push({
          id: "msg_recov_" + Date.now(),
          recipient: user.username,
          sender: "Administration Security",
          subject: "🛡️ Account Password Reset Logged",
          body: `Hello @${user.username}, your account passphrase has been reset successfully using the Master Account Recovery Key on ${new Date().toLocaleString()}. If you did not execute this action, please update your security PIN immediately.`,
          date: new Date().toISOString(),
          status: "unread"
        });

        localStorage.setItem(dbKey, JSON.stringify(db));
        
        // Sync to Firestore Cloud immediately before redirecting
        await saveDbToCloud(db);
        
        showToast("Passphrase reset successful! Redirecting in 2s...", "success");

        setTimeout(() => {
          window.location.href = "index.html";
        }, 2200);

      } catch (err) {
        console.error("Recovery error:", err);
        showToast("Failed to write password bypass records.", "error");
      }
    }
  </script>

</body>
</html>
