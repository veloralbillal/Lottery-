<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Lottery Winner</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      
      // Determine number of segments to keep in path (0 for custom domain, 1 for github.io/repo)
      // Usually, if there's a repository name, we keep 1.
      // But we can just use the current pathname logic.
      var pathSegments = l.pathname.split('/');
      
      // Redirect to index.html with the current path in the query string
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
        l.pathname.split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
